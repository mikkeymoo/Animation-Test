<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Noah's Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0716;
    --panel: #1a1230;
    --text: #f6f1ff;
    --muted: #b6a9d9;
    --red: #ff4757;
    --gold: #ffd166;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-inline: 16px; box-sizing: border-box;
  }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  canvas { display: block; border-radius: 8px; box-shadow: 0 18px 60px rgba(0,0,0,.6); max-width: 100%; }
  #bar { display: flex; align-items: center; gap: 12px; padding-block: 10px calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 15px; }
  #bar button { background: var(--panel); color: var(--text); border: 1px solid #33275a; border-radius: 999px; height: 38px; min-width: 38px; padding: 0 14px; cursor: pointer; font: 600 15px "Fredoka", sans-serif; }
  #bar button:hover { border-color: var(--gold); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #seek { flex: 1; min-width: 60px; accent-color: var(--red); }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(11,7,22,.78); }
  .card { text-align: center; padding: 24px; max-width: 34rem; }
  .card h1 { font-family: "Bangers", "Impact", sans-serif; font-weight: 400; font-size: clamp(64px, 14vw, 120px); letter-spacing: 2px; margin: 0; line-height: .95; color: var(--gold); text-shadow: 5px 5px 0 var(--red); transform: skewX(-8deg); }
  .card p { color: var(--muted); font-size: clamp(17px, 3.6vw, 21px); margin: 14px 0 24px; text-wrap: balance; }
  .go { font: 400 34px "Bangers", "Impact", sans-serif; letter-spacing: 1.5px; background: var(--red); color: #fff; border: 0; border-radius: 12px; padding: 10px 34px; cursor: pointer; transform: skewX(-8deg); box-shadow: 5px 5px 0 #000; }
  .go:hover { filter: brightness(1.1); }
  @media (max-width: 520px) { #bar { gap: 8px; } #rec { display: none; } }
</style>
<!--HEAD-END-->
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Noah's Quest, an anime-style animated film about the purpose of life with Jesus at the center"></canvas>
  <div id="intro" class="overlay">
    <div class="card">
      <h1>Noah's Quest</h1>
      <p>A 2-minute anime adventure about why we're here, for Michael, Kristina &amp; Noah. Turn your sound up.</p>
      <button class="go" id="go" type="button">Press Start</button>
    </div>
  </div>
  <div id="end" class="overlay" hidden>
    <div class="card">
      <h1>Quest complete</h1>
      <p>Talk about it: which level was your favorite, and who is on your team?</p>
      <button class="go" id="again" type="button">Play again</button>
    </div>
  </div>
</div>
<div id="bar">
  <button id="play" type="button" aria-label="Play">&#9654;</button>
  <input id="seek" type="range" min="0" max="124" step="0.01" value="0" aria-label="Seek">
  <span id="time">0:00 / 2:04</span>
  <button id="mute" type="button">Sound on</button>
  <button id="rec" type="button" title="Play once and save as a .webm video">Save video</button>
</div>

<script>
/* ==================================================================
   NOAH'S QUEST: an anime-style film, all pure JavaScript.
   Canvas 2D draws every frame; Web Audio synthesizes the score.
   URL params: ?t=seconds to start part-way through.
   ================================================================== */
(() => {
'use strict';

const W = 1280, H = 720, DUR = 124;
const BPM = 128, SD = 60 / BPM / 4;            // one 16th note
const PI = Math.PI, TAU = PI * 2;
const lerp = (a, b, u) => a + (b - a) * u;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const sg = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = u => 1 - Math.pow(1 - u, 3);
const easeIn = u => u * u * u;
const easeInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const backOut = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const elastic = u => u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -10 * u) * Math.sin((u * 10 - .75) * TAU / 3) + 1;
const mid = (a, b, u = .5) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
function h1(n) { n = Math.imul((n | 0) ^ 0x27d4eb2d, 0x165667b1); n ^= n >>> 15; n = Math.imul(n, 0x85ebca6b); n ^= n >>> 13; return (n >>> 0) / 4294967296; }

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const AO = '#120a1f';
const FB = '"Bangers", "Impact", sans-serif', FF = '"Fredoka", "Trebuchet MS", sans-serif', FC = '"Caveat", "Segoe Print", cursive';

// ---------- canvas helpers ----------
function path(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); }
function line(pts, w, c) { ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; path(pts); ctx.stroke(); }
function circle(x, y, r, fill, stroke, sw) { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function ellipse(x, y, rx, ry, fill, rot = 0) { if (rx <= 0 || ry <= 0) return; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function poly(pts, fill, stroke, sw) { path(pts); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke(); } }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function glow(x, y, r, rgb, a, mode = 'screen') { if (a <= 0 || r <= 0) return; ctx.save(); ctx.globalCompositeOperation = mode; ctx.globalAlpha = Math.min(1, a); const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(.4, `rgba(${rgb},.45)`); g.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); }
function fillAll(c, a = 1) { if (a <= 0) return; ctx.save(); ctx.setTransform(BASE, 0, 0, BASE, 0, 0); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function camera(cx, cy, z, shake, t) {
  const sx = shake ? (h1(Math.floor(t * 60)) - .5) * shake * 2 : 0, sy = shake ? (h1(Math.floor(t * 60) + 7) - .5) * shake * 2 : 0;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-cx + sx, -cy + sy);
}
function sparkle(x, y, s, col = '#fff', rot = PI / 4) { if (s <= 0) return; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * .18, -s * .18); ctx.lineTo(s, 0); ctx.lineTo(s * .18, s * .18); ctx.lineTo(0, s); ctx.lineTo(-s * .18, s * .18); ctx.lineTo(-s, 0); ctx.lineTo(-s * .18, -s * .18); ctx.closePath(); ctx.fill(); ctx.restore(); }
function speedRadial(cx, cy, t, a, col = AO, r0 = 200, n = 90) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < n; i++) {
    const an = h1(i + Math.floor(t * 20) * 3) * TAU, rr = r0 + h1(i + 5) * 140, R = 1400, w = .01 + h1(i + 11) * .012;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(an) * rr, cy + Math.sin(an) * rr);
    ctx.lineTo(cx + Math.cos(an + w) * R, cy + Math.sin(an + w) * R); ctx.lineTo(cx + Math.cos(an - w) * R, cy + Math.sin(an - w) * R); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
  }
  ctx.restore();
}
function speedHoriz(t, a, col = 'rgba(255,255,255,.6)', dir = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 16; i++) { const y = h1(i) * H, l = 120 + h1(i + 3) * 260, x = ((h1(i + 8) * W * 2 - dir * t * 2600) % (W * 2) + W * 2) % (W * 2) - W / 2; line([[x, y], [x + l, y]], 1 + h1(i + 1) * 3, col); }
  ctx.restore();
}
function rays(cx, cy, t, a, col, n = 14, len = 1200, spin = .15) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col;
  for (let i = 0; i < n; i++) { const an = i / n * TAU + t * spin, w = PI / n * .45; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(an - w) * len, cy + Math.sin(an - w) * len); ctx.lineTo(cx + Math.cos(an + w) * len, cy + Math.sin(an + w) * len); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function confetti(t, t0, ox, oy, cols, n = 80, spread = 1) {
  const dt = t - t0; if (dt < 0 || dt > 3.5) return;
  for (let i = 0; i < n; i++) {
    const vx = (h1(i) - .5) * 1000 * spread, vy = -(380 + h1(i + 99) * 560), x = ox + vx * dt * .8, y = oy + vy * dt + 450 * dt * dt;
    if (y > H + 30) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(h1(i + 7) * 6 + dt * (4 + h1(i + 3) * 8)); ctx.globalAlpha = clamp01(1 - (dt - 2.7) / .8);
    ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(-7, -4, 14, 8); ctx.restore();
  }
}

// ---------- anime text ----------
function slamText(txt, x, y, lt, o = {}) {
  const dur = o.dur || 1.4; if (lt < 0 || lt > dur) return;
  const a = sg(lt, 0, .05) * (1 - sg(lt, dur - .2, dur));
  const s = lerp(o.from || 1.7, 1, easeOut(sg(lt, 0, .2)));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(o.rot ?? -.1); ctx.scale(s, s);
  ctx.font = `${o.size || 150}px ${FB}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = (o.size || 150) * .12; ctx.strokeStyle = AO; ctx.lineJoin = 'round'; ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = o.shadow || '#ff4757'; ctx.fillText(txt, 6, 6);
  ctx.fillStyle = o.fill || '#ffe066'; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function banner(txt, lt, dur, o = {}) {
  if (lt < 0 || lt > dur) return;
  const a = 1 - sg(lt, dur - .25, dur);
  const x = lerp(-420, o.x || 640, easeOut(sg(lt, 0, .3)));
  const y = o.y || 170, size = o.size || 96;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.transform(1, 0, -.18, 1, 0, 0);
  ctx.font = `${size}px ${FB}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 90;
  ctx.fillStyle = 'rgba(18,10,31,.88)'; ctx.fillRect(-w / 2, -size * .62, w, size * 1.2);
  ctx.fillStyle = o.accent || '#ff4757'; ctx.fillRect(-w / 2, size * .5, w, 8); ctx.fillRect(-w / 2, -size * .62, 12, size * 1.2);
  ctx.fillStyle = o.accent || '#ff4757'; ctx.fillText(txt, 5, 5);
  ctx.fillStyle = o.fill || '#ffffff'; ctx.fillText(txt, 0, 0);
  if (o.sub) { ctx.font = `${size * .34}px ${FB}`; ctx.fillStyle = '#ffe066'; ctx.fillText(o.sub, 0, size * .9); }
  ctx.restore();
}
function verseBox(txt, ref, a, y = 640, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const size = o.size || 36;
  ctx.font = `${size}px ${FB}`;
  const lines = txt.split('\n'), w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 70, hh = lines.length * size * 1.15 + 64;
  const yy = y - hh / 2;
  ctx.save(); ctx.transform(1, 0, -.15, 1, 0, 0); ctx.translate(y * .15, 0);
  ctx.fillStyle = 'rgba(18,10,31,.86)'; ctx.fillRect(640 - w / 2, yy, w, hh);
  ctx.fillStyle = o.accent || '#ff4757'; ctx.fillRect(640 - w / 2, yy + hh - 6, w, 6);
  ctx.restore();
  ctx.fillStyle = '#fff';
  lines.forEach((l, i) => ctx.fillText(l, 640, yy + 26 + size * .55 + i * size * 1.15));
  ctx.font = `${size * .66}px ${FB}`; ctx.fillStyle = '#ffe066'; ctx.fillText(ref, 640, yy + hh - 20);
  ctx.restore();
}
function levelCard(lt, num, title) {
  if (lt < 0 || lt > 1.9) return;
  const inU = easeOut(sg(lt, 0, .28)), outU = easeIn(sg(lt, 1.55, 1.9));
  ctx.save();
  ctx.fillStyle = AO; ctx.globalAlpha = 1 - outU; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  speedRadial(640, 360, lt, (1 - outU) * .5, '#2b1a4d', 150);
  ctx.translate(lerp(-W, 0, inU) + outU * W * 1.2, 0);
  ctx.beginPath(); ctx.moveTo(-40, 230); ctx.lineTo(W + 40, 190); ctx.lineTo(W + 40, 520); ctx.lineTo(-40, 560); ctx.closePath(); ctx.fillStyle = '#ff4757'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-40, 250); ctx.lineTo(W + 40, 210); ctx.lineTo(W + 40, 500); ctx.lineTo(-40, 540); ctx.closePath(); ctx.fillStyle = AO; ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `60px ${FB}`; ctx.fillStyle = '#ffe066'; ctx.fillText(num, 640 - 60 * (1 - inU), 300);
  ctx.font = `150px ${FB}`; ctx.fillStyle = '#ff4757'; ctx.fillText(title, 646 + 80 * (1 - inU), 426); ctx.fillStyle = '#fff'; ctx.fillText(title, 640 + 80 * (1 - inU), 420);
  ctx.restore();
}
function letterbox() { ctx.save(); ctx.setTransform(BASE, 0, 0, BASE, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 16); ctx.fillRect(0, H - 16, W, 16); ctx.restore(); }

// ==================================================================
// CHARACTERS: one anime cel-shaded rig, three people
// ==================================================================
const NOAH = { kid: true, h: 150, skin: '#ffe0cc', skinShade: '#f0b39a', hair: '#ff9a3c', hairShade: '#d96a1c', hairStyle: 'spiky', top: '#ff4757', topShade: '#c0283a', bottom: '#1e2a78', bottomShade: '#10174a', shoe: '#ffffff', number: '10', eye: '#2e7dd1' };
const DAD = { h: 250, build: 1.35, skin: '#ffd9c2', skinShade: '#eaa98c', hair: '#6b4a33', hairShade: '#4a3222', hairStyle: 'bun', beard: '#c9683a', beardShade: '#94482a', top: '#8e9a9b', topShade: '#6c7778', longSleeve: true, hood: true, bottom: '#34495e', bottomShade: '#22313f', longPants: true, shoe: '#2d2d2d', eye: '#6b4a2b' };
const MOM = { h: 228, build: 1, skin: '#ffe3d0', skinShade: '#f0b8a0', hair: '#ffd972', hairShade: '#e0b04a', hairStyle: 'pony', top: '#2f3b73', topShade: '#1f2855', plaid: '#d0414f', longSleeve: true, bottom: '#1d1b26', bottomShade: '#0d0c12', longPants: true, shoe: '#ffffff', eye: '#3a7bd5', lashes: true };

/* body(): joint positions from feet baseline (x, y) plus optional hands/feet targets */
function body(x, y, S, o = {}) {
  const h = S.h * (o.scale || 1), kid = S.kid, sq = o.sq || 1;
  const hr = h * (kid ? .17 : .12), lean = o.lean || 0, top = y - h * sq;
  const head = [x + lean, top + hr];
  const sh = [x + lean * .6, top + hr * 2 + h * .05];
  const sw = h * (kid ? .1 : .11) * (S.build || 1);
  const shL = [sh[0] - sw, sh[1]], shR = [sh[0] + sw, sh[1]];
  const hip = [x + lean * .1, y - h * .45 * sq];
  const fL = o.fL || [x - h * .09, y], fR = o.fR || [x + h * .09, y];
  const hL = o.hL || [shL[0] - h * .05, hip[1] + h * .03], hR = o.hR || [shR[0] + h * .05, hip[1] + h * .03];
  const kf = o.kneeFwd ?? h * .05;
  const knee = f => [(hip[0] + f[0]) / 2 + kf, (hip[1] + f[1]) / 2];
  const elbow = (s, hd, side) => { const m = mid(s, hd), dx = hd[0] - s[0], dy = hd[1] - s[1], l = Math.hypot(dx, dy) || 1; return [m[0] - dy / l * h * .06 * side, m[1] + dx / l * h * .06 * side]; };
  return { x, y, h, hr, top, head, sh, shL, shR, hip, fL, fR, kL: knee(fL), kR: knee(fR), hL, hR, eL: elbow(shL, hL, -1), eR: elbow(shR, hR, 1), sw };
}
function runBody(x, y, S, ph, o = {}) {
  const h = S.h * (o.scale || 1);
  return body(x, y, S, { lean: h * .07, fL: [x + Math.sin(ph) * h * .2, y - Math.max(0, Math.cos(ph)) * h * .1], fR: [x - Math.sin(ph) * h * .2, y - Math.max(0, -Math.cos(ph)) * h * .1],
    hL: o.hL || [x - Math.sin(ph) * h * .2, y - h * .5], hR: o.hR || [x + Math.sin(ph) * h * .2 + h * .05, y - h * .5], ...o });
}

function drawChar(P, S, o = {}) {
  const wht = !!o.white, C = c => wht ? '#fff' : c, OL = wht ? '#fff' : AO;
  const h = P.h, kid = S.kid, olw = h * .012 + 1.4;
  const legW = h * (kid ? .095 : .08) * Math.min(S.build || 1, 1.25), armW = h * (kid ? .075 : .06) * Math.min(S.build || 1, 1.3);
  const limb = (pts, w, col, shade) => { line(pts, w + olw * 2, OL); line(pts, w, C(col)); if (!wht && shade) { ctx.save(); ctx.translate(w * .22, w * .1); line(pts, w * .4, shade); ctx.restore(); } };
  const [hx, hy] = P.head, r = P.hr;
  const t = o.t || 0;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  // ponytail sits behind everything
  if (S.hairStyle === 'pony') {
    const sway = Math.sin(t * 5) * r * .15;
    const pts = [[hx + r * .45, hy - r * .9], [hx + r * 1.35, hy - r * .6], [hx + r * 1.55 + sway, hy + r * .4], [hx + r * 1.2 + sway, hy + r * 1.5], [hx + r * .95, hy + r * .5], [hx + r * .7, hy - r * .3]];
    poly(pts, C(S.hair), OL, olw);
  }
  const leg = (f, k) => {
    if (S.longPants) limb([P.hip, k, f], legW * 1.12, S.bottom, S.bottomShade);
    else { limb([P.hip, k, f], legW, S.skin, S.skinShade); limb([P.hip, mid(P.hip, k, .85)], legW * 1.5, S.bottom, S.bottomShade); }
    ellipse(f[0] + h * .035, f[1] - h * .02, h * .07 + olw, h * .035 + olw, OL);
    ellipse(f[0] + h * .035, f[1] - h * .02, h * .07, h * .035, C(S.shoe));
  };
  const arm = (s, e, hd) => {
    if (S.longSleeve) limb([s, e, hd], armW * 1.15, S.top, S.topShade);
    else { limb([s, e, hd], armW, S.skin, S.skinShade); limb([s, mid(s, e, .6)], armW * 1.45, S.top, S.topShade); }
    circle(hd[0], hd[1], armW * .72, C(S.skin), OL, olw);
  };
  leg(P.fL, P.kL); arm(P.shL, P.eL, P.hL); leg(P.fR, P.kR);
  // torso
  const tw = P.sw, hip = P.hip;
  const torso = () => { ctx.beginPath(); ctx.moveTo(P.shL[0] - 3, P.shL[1] - h * .03); ctx.lineTo(P.shR[0] + 3, P.shR[1] - h * .03); ctx.quadraticCurveTo(P.shR[0] + h * .03, mid(P.shR, hip)[1], hip[0] + tw * .95, hip[1] + h * .03); ctx.lineTo(hip[0] - tw * .95, hip[1] + h * .03); ctx.quadraticCurveTo(P.shL[0] - h * .03, mid(P.shL, hip)[1], P.shL[0] - 3, P.shL[1] - h * .03); ctx.closePath(); };
  torso(); ctx.lineWidth = olw * 2; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.stroke(); ctx.fillStyle = C(S.top); ctx.fill();
  if (!wht) {
    ctx.save(); torso(); ctx.clip();
    ctx.fillStyle = S.topShade; ctx.fillRect(P.sh[0] + tw * .3, P.sh[1] - h * .1, tw * 2, h * .6);

// PLAYER
// ==================================================================
const $ = id => document.getElementById(id);
